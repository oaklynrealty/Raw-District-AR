<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Gold Button</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap");

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes spin {
      to {
        --angle: 360deg;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #080808;
      font-family: "Inter", sans-serif;
    }

    .outer {
      position: relative;
      display: inline-block;
      border-radius: 50px;
      isolation: isolate;
    }

    .glow-ring {
      position: absolute;
      inset: -10px;
      border-radius: 60px;
      filter: blur(14px);
      background: conic-gradient(
        from var(--angle),
        transparent 55deg,
        rgba(201,168,76,0.5) 85deg,
        rgba(232,201,106,0.6) 100deg,
        rgba(201,168,76,0.4) 115deg,
        transparent 145deg
      );
      animation: spin 2.8s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    .border-ring {
      position: absolute;
      inset: 0;
      border-radius: 50px;
      padding: 2px;
      background: conic-gradient(
        from var(--angle),
        transparent 55deg,
        #E8C96A 85deg,
        #ffffff 100deg,
        #C9A84C 115deg,
        transparent 145deg
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spin 2.8s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    .btn {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50px;
      padding: 22px 72px;
      background: linear-gradient(135deg, #C9A84C 0%, #f0d97a 50%, #C9A84C 100%);
      color: #1a0e00;
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.13em;
      line-height: 1;
      text-transform: uppercase;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="glow-ring"></div>
    <div class="border-ring"></div>
    <button class="btn" type="button">Request Project Information</button>
  </div>
</body>
</html>
